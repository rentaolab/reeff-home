<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Reeff">
  <!-- Reeff family mark — single source of truth for every icon, OG card and PWA asset.
       Run `npm run brand` after editing. The R is the real outline of Liberation Sans Bold
       (Arial-metric compatible, SIL OFL 1.1); the four dots are the products
       (PDF red, Image violet, Audio amber, Receipt emerald).
